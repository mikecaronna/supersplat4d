<!DOCTYPE html>
<html>

        <title>4D Viewer</title>
        <meta charset="utf-8" />

        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">

        <!-- eruda CDN debug console removed for offline/self-hosted use -->

        
        <!-- Service worker -->
        <script>
            const sw = navigator.serviceWorker;
            if (sw) {
                sw.register('./sw.js')
                    .then(reg => console.log('service worker registered', reg))
                    .catch(err => console.log('failed to register service worker', err));
            }
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>
    <!-- Web analytics, injected at build time from CF_BEACON_TOKEN. Empty
         unless that variable is set, so forks do not report into an account
         they do not own. -->
